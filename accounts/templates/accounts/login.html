<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – Sistema Pañol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3a5f 0%, #2e86de 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header {
      background: #1e3a5f;
      color: white;
      border-radius: 16px 16px 0 0;
      padding: 28px;
      text-align: center;
    }
    .login-header .icon { font-size: 3rem; margin-bottom: 8px; }
    .login-header h1  { font-size: 1.3rem; font-weight: 700; margin: 0; }
    .login-header p   { font-size: 0.85rem; opacity: 0.75; margin: 4px 0 0; }
    .login-body { padding: 28px; }
    .btn-login {
      background: #2e86de;
      border: none;
      font-weight: 600;
      letter-spacing: .03em;
    }
    .btn-login:hover { background: #1a6dbf; }
    .form-control:focus { border-color: #2e86de; box-shadow: 0 0 0 .2rem rgba(46,134,222,.25); }
  </style>
</head>
<body>
  <div class="login-card bg-white">
    <div class="login-header">
      <div class="icon">🔧</div>
      <h1>Sistema de Pañol</h1>
      <p>PROA – Villa del Totoral</p>
    </div>
    <div class="login-body">

      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Usuario</label>
          <input type="text" class="form-control" id="username" name="username"
                 placeholder="Ingresá tu usuario" autofocus required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Ingresá tu contraseña" required>
        </div>
        <button type="submit" class="btn btn-login btn-primary w-100 py-2">
          Iniciar Sesión
        </button>
      </form>

      <div class="text-center mt-4 text-muted" style="font-size:.8rem">
        <strong>Usuarios de prueba:</strong><br>
        admin / admin123 &nbsp;|&nbsp; panolero / panolero123
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
