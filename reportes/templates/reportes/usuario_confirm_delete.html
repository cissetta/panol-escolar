{% extends 'base.html' %}
{% block title %}Eliminar usuario{% endblock %}
{% block page_title %}Eliminar usuario{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <p>¿Deseas eliminar al usuario <strong>{{ usuario.username }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Eliminar</button>
      <a href="{% url 'reportes:usuarios' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
