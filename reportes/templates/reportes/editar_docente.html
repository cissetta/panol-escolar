{% extends 'base.html' %}
{% block title %}Grupo 5 - Docentes{% endblock %}
{% block page_title %}Editar docente{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white fw-semibold">✏️ Editar docente</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.nombre.id_for_label }}" class="form-label">Nombre</label>
            {{ form.nombre }}
          </div>
          <div class="mb-3">
            <label for="{{ form.apellido.id_for_label }}" class="form-label">Apellido</label>
            {{ form.apellido }}
          </div>
          <div class="mb-3">
            <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
            {{ form.email }}
          </div>
          <div class="form-check mb-3">
            {{ form.activo }}
            <label class="form-check-label" for="{{ form.activo.id_for_label }}">Activo</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
            <a href="{% url 'reportes:docentes' %}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
