{% extends 'base.html' %}
{% block title %}Eliminar Plan{% endblock %}
{% block page_title %}Eliminar Plan de Mantenimiento{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card card-panol">
      <div class="card-body p-4 text-center">
        <div class="mb-3" style="font-size:3rem;">⚠️</div>
        <h5 class="fw-semibold mb-1">¿Eliminar este plan?</h5>
        <p class="text-muted mb-1"><strong>{{ plan.nombre }}</strong></p>
        <p class="text-muted small mb-4">Herramienta: {{ plan.herramienta.nombre }}</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <a href="{% url 'mantenimiento:index' %}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash3"></i> Eliminar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
