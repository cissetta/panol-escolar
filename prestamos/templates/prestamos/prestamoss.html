{% extends 'base.html' %}
{% block title %}Registrar préstamo{% endblock %}
{% block page_title %}Registrar préstamo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-10">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-1">Nuevo préstamo</h2>
        <p class="text-muted mb-4">Seleccioná alumno, herramienta, docente y dejá una observación si corresponde.</p>

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label for="alumno_qr" class="form-label fw-semibold">Alumno</label>
            <select class="form-select" id="alumno_qr" name="alumno_qr" required>
              <option value="">Seleccioná un alumno...</option>
              {% for alumno in alumnos %}
                <option value="{{ alumno.legajo }}">{{ alumno.apellido }}, {{ alumno.nombre }} ({{ alumno.legajo }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="herr_qr" class="form-label fw-semibold">Herramienta</label>
            <select class="form-select" id="herr_qr" name="herr_qr" required>
              <option value="">Seleccioná una herramienta...</option>
              {% for herramienta in herramientas %}
                <option value="{{ herramienta.codigo }}">{{ herramienta.nombre }} ({{ herramienta.codigo }})</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="docente" class="form-label fw-semibold">Docente</label>
            <select class="form-select" id="docente" name="docente" required>
              <option value="">Seleccioná un docente...</option>
              {% for docente in docentes %}
                <option value="{{ docente.pk }}">{{ docente.apellido }}, {{ docente.nombre }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-4">
            <label for="observaciones" class="form-label fw-semibold">Observaciones</label>
            <textarea class="form-control" id="observaciones" name="observaciones" rows="4" placeholder="Escribí observaciones del préstamo..."></textarea>
          </div>

          <div class="d-flex gap-2">
            <a href="{% url 'prestamos:activos' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Confirmar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
